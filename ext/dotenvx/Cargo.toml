[package]
name = "dotenvx_native"
version = "4.0.6"
edition = "2021"
rust-version = "1.83"
publish = false

[lib]
name = "dotenvx_native"
crate-type = ["cdylib"]

[dependencies]
dotenvx-ll = { path = "../../../forge/dotenvx-ll" }
magnus = "0.8"
rb-sys = { version = "0.9.128", default-features = false, features = ["stable-api-compiled-force"] }
serde_json = "1"
