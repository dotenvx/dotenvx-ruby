[package]
name = "dotenvx_native"
version = "4.0.3"
edition = "2021"
rust-version = "1.83"
publish = false

[lib]
name = "dotenvx_native"
crate-type = ["cdylib"]

[dependencies]
dotenvx-primitives = "=2.2.0"
magnus = "0.8"
rb-sys = { version = "0.9.128", default-features = false, features = ["stable-api-compiled-force"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
