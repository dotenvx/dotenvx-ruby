name: publish
run-name: Ruby release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Forge-generated release tag (vX.Y.Z)
        required: true
        type: string
      publish:
        description: Publish missing gems after validation (false only tests)
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - run: ruby .github/scripts/release.rb verify

  test:
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
        ruby: ['3.1', '3.2', '3.3', '3.4']
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
          - os: macos-15-intel
            platform: x86_64-darwin
          - os: macos-15
            platform: arm64-darwin
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: ruby .github/scripts/release.rb verify
      - name: Install and test the exact prebuilt gem
        env:
          GEM_PLATFORM: ${{ matrix.platform }}
        run: |
          version="${RELEASE_TAG#v}"
          gem install --local --no-document "pkg/dotenvx-$version-$GEM_PLATFORM.gem"
          ruby .github/scripts/test-native.rb "$version"

  publish:
    needs: [validate, test]
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-24.04
    environment: release
    concurrency: dotenvx-ruby-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - run: ruby .github/scripts/release.rb verify
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish gems using RubyGems OIDC
        env:
          PUBLISH: ${{ inputs.publish }}
        run: ruby .github/scripts/release.rb publish
